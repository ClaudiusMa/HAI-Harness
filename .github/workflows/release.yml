name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hai-harness-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan release
        id: plan
        run: |
          set -euo pipefail
          node .github/scripts/plan-release.mjs > release-plan.json
          cat release-plan.json
          publish="$(node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("release-plan.json","utf8")); process.stdout.write(p.publish ? "true" : "false")')"
          action="$(node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("release-plan.json","utf8")); process.stdout.write(p.action || "")')"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Open release pull request
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.action == 'prepare'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node .github/scripts/plan-release.mjs --apply
          tag="$(node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("release-plan.json","utf8")); process.stdout.write(p.tag)')"
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("release-plan.json","utf8")); const body = `Review and merge this pull request.\n\nAfter the merge reaches main, the release workflow tags that commit and publishes the GitHub Release. This workflow does not merge the pull request.\n\n${p.summary}\n`; fs.writeFileSync("release-notes.txt", body);'
          message="$(node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("release-plan.json","utf8")); process.stdout.write(p.commitMessage)')"
          branch="release/$tag"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add package.json release.json
          git commit -m "$message"
          git push origin "HEAD:$branch"

          gh pr create --base main --head "$branch" --title "$message" --body-file release-notes.txt

      - name: Publish merged release
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.action == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("release-plan.json","utf8")); process.stdout.write(p.tag)')"
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("release-plan.json","utf8")); fs.writeFileSync("release-notes.txt", p.summary + "\n");'
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --target main --title "$tag" --notes-file release-notes.txt
