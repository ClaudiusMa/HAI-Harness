name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hai-harness-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan release
        id: plan
        run: |
          set -euo pipefail
          node .github/scripts/plan-release.mjs > release-plan.json
          cat release-plan.json
          publish="$(node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("release-plan.json","utf8")); process.stdout.write(p.publish ? "true" : "false")')"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.plan.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node .github/scripts/plan-release.mjs --apply
          version="$(node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("release-plan.json","utf8")); process.stdout.write(p.version)')"
          tag="$(node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("release-plan.json","utf8")); process.stdout.write(p.tag)')"
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("release-plan.json","utf8")); fs.writeFileSync("release-notes.txt", p.summary);'
          message="$(node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("release-plan.json","utf8")); process.stdout.write(p.commitMessage)')"
          branch="release/$tag"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add package.json release.json
          git commit -m "$message"
          git push origin "HEAD:$branch"

          gh pr create --base main --head "$branch" --title "$message" --body-file release-notes.txt
          gh pr merge --merge --delete-branch
          git fetch origin main
          git tag "$tag" origin/main
          git push origin "$tag"
          gh release create "$tag" --target main --title "$tag" --notes-file release-notes.txt
